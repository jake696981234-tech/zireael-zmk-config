# Shared configuration for Dao split keyboard
# This file is automatically included for all boards

# Split keyboard UUID - MUST be the same on both halves
# This UUID allows the left and right halves to find and pair with each other
# Generate your own with: python3 -c 'import uuid; print(uuid.uuid4())'
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_STACK_SIZE=2048
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_QUEUE_SIZE=20

# Set a unique UUID for this keyboard's split pairing
CONFIG_ZMK_BLE_SPLIT_PERIPHERAL_COUNT=1

# Enable keyboard-generated mouse movement, scrolling, and buttons
CONFIG_ZMK_POINTING=y

# Uncomment to enable deep sleep after 15 minutes of inactivity
# CONFIG_ZMK_SLEEP=y
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Increase BLE transmit power for better range
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
