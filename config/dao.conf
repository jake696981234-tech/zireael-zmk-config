# Shared configuration for Dao split keyboard
# This file is automatically included for all boards

# Shared split BLE worker tuning. Split identity and bonds are stored by ZMK;
# this file does not define or require a custom UUID.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_STACK_SIZE=2048
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_QUEUE_SIZE=20

# The left central expects exactly one peripheral half.
CONFIG_ZMK_BLE_SPLIT_PERIPHERAL_COUNT=1

# Enable keyboard-generated mouse movement, scrolling, and buttons
CONFIG_ZMK_POINTING=y

# Deep sleep is enabled by both board defconfigs. The pinned ZMK default timeout
# is 900000 ms (15 minutes); set CONFIG_ZMK_IDLE_SLEEP_TIMEOUT here to override.

# Increase BLE transmit power for better range
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
